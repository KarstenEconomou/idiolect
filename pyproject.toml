[project]
name = "idiolect"
version = "0.1.0"
description = "Build language models that reproduce individual writing styles"
readme = "README.md"
authors = [
    { name = "Karsten Economou", email = "economoukarsten@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.5",
    "pytz>=2026.3.post1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "textual>=8,<9",
    "ty",
]

[project.scripts]
idiolect = "idiolect.cli:main"

[project.optional-dependencies]
train = [
    "huggingface-hub>=1.28.0",
    "mlx-lm[train]>=0.31.3",
]
chat = [
    "markdown-it-py>=4,<5",
    "textual>=8,<9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
